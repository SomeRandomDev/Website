<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Quiz</title>
</head>
<body>
  <form id="quizForm">
    <fieldset>
      <legend>Qu 1 ?</legend>
      <label><input type="radio" name="q1" value="Bleu"> Bleu</label><br>
      <label><input type="radio" name="q1" value="Rouge"> Rouge</label><br>
      <label><input type="radio" name="q1" value="Vert"> Vert</label><br>
      <label>
        <input type="radio" name="q1" value="autre" id="q1-other-radio"> Autre :
      </label>
      <textarea
        name="q1-other-text"
        id="q1-other-text"
        disabled
        rows="6"
        placeholder="Please write here..."
        style="width: 100%; font-size: 1rem; padding: 10px; margin-top: 8px; box-sizing: border-box; border-radius: 8px;"
      ></textarea>
    </fieldset>

    <fieldset>
      <legend>Qu2 ?</legend>
      <label><input type="radio" name="q2" value="Bleu"> Bleu</label><br>
      <label><input type="radio" name="q2" value="Rouge"> Rouge</label><br>
      <label><input type="radio" name="q2" value="Vert"> Vert</label><br>
      <label>
        <input type="radio" name="q2" value="autre" id="q2-other-radio"> Autre :
      </label>
      <textarea
        name="q2-other-text"
        id="q2-other-text"
        disabled
        rows="6"
        placeholder="Please write here..."
        style="width: 100%; font-size: 1rem; padding: 10px; margin-top: 8px; box-sizing: border-box; border-radius: 8px;"
      ></textarea>
    </fieldset>

    <fieldset>
      <legend>Qu 3 ?</legend>
      <label><input type="radio" name="q3" value="Bleu"> Bleu</label><br>
      <label><input type="radio" name="q3" value="Rouge"> Rouge</label><br>
      <label><input type="radio" name="q3" value="Vert"> Vert</label><br>
      <label>
        <input type="radio" name="q3" value="autre" id="q3-other-radio"> Autre :
      </label>
      <textarea
        name="q3-other-text"
        id="q3-other-text"
        disabled
        rows="6"
        placeholder="Please write here..."
        style="width: 100%; font-size: 1rem; padding: 10px; margin-top: 8px; box-sizing: border-box; border-radius: 8px;"
      ></textarea>
    </fieldset>

    <button type="submit">Envoyer</button>
  </form>
  <p id="thanks" style="display:none;">Thanks a lot for taking the time to answer me !</p>

  <script type="module">
    import { inject } from 'https://cdn.jsdelivr.net/npm/@vercel/analytics@1.6.1/dist/index.mjs';
    inject();
  </script>

  <script>
    document.getElementById('quizForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const answers = Object.fromEntries(formData.entries());

      ['q1', 'q2', 'q3'].forEach(q => {
        if (answers[q] === 'autre' && answers[`${q}-other-text`]) {
          answers[q] = answers[`${q}-other-text`];
        }
        delete answers[`${q}-other-text`];
      });

      await fetch('/api/save-quiz', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answers }),
      });

      document.getElementById('quizForm').style.display = 'none';
      document.getElementById('thanks').style.display = 'block';
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      function setupOtherToggle(questionName) {
        const otherRadio = document.getElementById(`${questionName}-other-radio`);
        const otherText = document.getElementById(`${questionName}-other-text`);

        document.querySelectorAll(`input[name="${questionName}"]`).forEach(radio => {
          radio.addEventListener('change', () => {
            otherText.disabled = radio !== otherRadio;
            if (radio === otherRadio) otherText.focus();
          });
        });
      }

      setupOtherToggle('q1');
      setupOtherToggle('q2');
      setupOtherToggle('q3');
    });
  </script>
</body>
</html>
