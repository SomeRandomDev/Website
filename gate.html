<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>...</title>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <style>
    body { display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
    form { text-align: center; }
    input { padding: 8px; font-size: 1rem; }
    button { padding: 8px 16px; margin-left: 8px; }
    #error { color: #c0392b; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <form id="gateForm">
    <p id="question"></p>
    <input type="text" id="answer" autofocus autocomplete="off" />
    <button type="submit">Enter</button>
    <p id="error">That's not it.</p>
  </form>

  <script>
    // Question text is passed in via a small API call so it's not hardcoded twice
    fetch('/api/gate?question=1')
      .then(r => r.json())
      .then(d => document.getElementById('question').textContent = d.question);

    const params = new URLSearchParams(window.location.search);
    const from = params.get('from') || '/';

    document.getElementById('gateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const answer = document.getElementById('answer').value;
      const res = await fetch('/api/gate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answer }),
      });
      if (res.ok) {
        window.location.href = from;
      } else {
        document.getElementById('error').style.display = 'block';
      }
    });
  </script>
</body>
</html>
